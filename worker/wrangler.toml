name = "eggo-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
migrations_dir = "migrations"

# Поддомен API на нашем домене: Cloudflare привяжет его к воркеру
# и выпустит сертификат автоматически при первом деплое
routes = [
  { pattern = "api.eggotg.ru", custom_domain = true }
]

# После `npx wrangler d1 create eggo` впишите сюда выданный database_id
# (локальный `npm run worker:dev` работает и с заглушкой)
[[d1_databases]]
binding = "DB"
database_name = "eggo"
database_id = "TODO-ВПИШИТЕ-ID-ПОСЛЕ-wrangler-d1-create"

[vars]
# После деплоя фронта сузьте до адреса мини-аппа, например
# ALLOWED_ORIGIN = "https://kevinglare.github.io"
ALLOWED_ORIGIN = "*"

# Крон пушей: раз в полчаса проверяем подписчиков
[triggers]
crons = ["*/30 * * * *"]

# BOT_TOKEN задаётся секретом, не здесь: npx wrangler secret put BOT_TOKEN
