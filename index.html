<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- SEO: сайт индексируется как обычная страница (eggotg.ru), играется же
         внутри Telegram Mini App. Картинки — public/, пути относительные (base './'). -->
    <title>Eggo — тамагочи в Telegram: вырастите виртуального питомца</title>
    <meta
      name="description"
      content="Eggo — тамагочи в Telegram: вылупите яйцо, кормите, играйте и ухаживайте за виртуальным питомцем. Квесты, награды и звёзды каждый день."
    />
    <link rel="canonical" href="https://eggotg.ru/" />
    <!-- Верификация Яндекс Вебмастера (ресурс с префиксом https://eggotg.ru/) -->
    <meta name="yandex-verification" content="fa904e7c6c76688c" />
    <!-- Верификация Google Search Console (ресурс с префиксом https://eggotg.ru/) -->
    <meta name="google-site-verification" content="x1gcZknYm0CbaHfBim1D_azgSw_lRrB1vI7FqIdpUhI" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Open Graph: так ссылка на Eggo выглядит в превью Telegram и соцсетей -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eggo" />
    <meta property="og:title" content="Eggo — тамагочи в Telegram" />
    <meta
      property="og:description"
      content="Вылупите яйцо, кормите, играйте и ухаживайте за своим виртуальным питомцем."
    />
    <meta property="og:url" content="https://eggotg.ru/" />
    <meta property="og:image" content="https://eggotg.ru/og-image.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta name="twitter:card" content="summary" />
    <!-- Schema.org для поисковиков и ИИ-ассистентов (ChatGPT, Perplexity) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Eggo",
        "url": "https://eggotg.ru/",
        "description": "Тамагочи в Telegram: вылупите яйцо, кормите, играйте и ухаживайте за виртуальным питомцем.",
        "genre": ["Tamagotchi", "Virtual pet"],
        "applicationCategory": "GameApplication",
        "operatingSystem": "Telegram Mini App",
        "inLanguage": "ru",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "RUB" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- Вендорим локально: telegram.org недоступен из РФ без VPN, запрос зависал
         до загрузки всего приложения. Обновлять (нужен VPN):
         curl -o public/telegram-web-app.js https://telegram.org/js/telegram-web-app.js
         Скачано 2026-11-04, sha256 124bdff7ba3f…e3b5908 -->
    <script src="./telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
